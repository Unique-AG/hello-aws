  name: cloud-api-adaptor-daemonset
  namespace: sbx
spec:
  selector:
    matchLabels:
      app: cloud-api-adaptor
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: cloud-api-adaptor
    spec:
      serviceAccountName: cloud-api-adaptor
      containers:
      - command:
        - /usr/local/bin/entrypoint.sh
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        envFrom:
        - secretRef:
            name: peer-pods-secret
        - configMapRef:
            name: peer-pods-cm
        image: quay.io/confidential-containers/cloud-api-adaptor:e3e0f00480b41c08e3e4dbc6b64aba7722fb65f9@sha256:0eaa02a8fad19a2bf1b27745fb8d0ca28edc68da1f8c5c886b87444f188170ef
        imagePullPolicy: Always
        name: cloud-api-adaptor-con
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - SYS_ADMIN
        startupProbe:
          httpGet:
            path: /startup
            port: 8000
            host: 127.0.0.1
          failureThreshold: 30
          periodSeconds: 20
          initialDelaySeconds: 20
        # TODO: We should think about a better patch strategy for keeping per provider
        # patches in different files, otherwise this template might get bloated.
        volumeMounts:
        - mountPath: /run/peerpod
          name: pods-dir
        - mountPath: /run/netns
          mountPropagation: HostToContainer
          name: netns
        - mountPath: /run/xtables.lock
          name: xtables-lock
        - mountPath: /lib/modules
          name: lib-modules
          readOnly: true
        # # setting for cloud provider external plugin
        # - mountPath: /cloud-providers
        #   name: provider-dir
        # # setting for cloud provider external plugin
        - mountPath: /run/kata-containers/shared/direct-volumes
          name: kata-direct-volumes-dir
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        workload: sandbox
      tolerations:
        - effect: NoSchedule
          key: workload
          value: sandbox
      volumes:
      - hostPath:
          path: /run/peerpod
        name: pods-dir
      - hostPath:
          path: /run/netns
        name: netns
      - hostPath:
          path: /run/xtables.lock
          type: FileOrCreate
        name: xtables-lock
      - hostPath:
