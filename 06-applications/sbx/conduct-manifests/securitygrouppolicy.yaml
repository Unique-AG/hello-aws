# Gives Fargate sandbox pods the 05-compute sandbox security group, their L4 control.
apiVersion: vpcresources.k8s.aws/v1beta1
kind: SecurityGroupPolicy
metadata:
  name: sbx-sandbox
  namespace: sbx
spec:
  podSelector:
    matchLabels:
      unique.app/sandbox-template: unique-polyagent-001-fargate
  securityGroups:
    groupIds:
      - sg-0ae138073e0e8e533
