spec:
  name: qdrant
  autoSync: true
  sources:
    - chart: qdrant
      repoURL: https://qdrant.github.io/qdrant-helm
      targetRevision: 1.13.1
      helm:
        releaseName: qdrant
        valuesObject:
          replicaCount: 1
          image:
            repository: qdrant/qdrant
            tag: v1.13.1
            useUnprivilegedImage: true # auto-appends -unprivileged to the tag
          updateVolumeFsOwnership: false # as this is a new cluster, the file system was never running as root
          resources:
            requests:
              cpu: 100m
              memory: 1.8Gi
            limits:
              memory: 2Gi
          nodeSelector:
            scalability: steady
            lifecycle: persistent
          persistence:
            accessModes:
              - ReadWriteOnce
            size: 10Gi
            storageClassName: gp3
          # Qdrant serves /metrics on the http port; the chart's own
          # ServiceMonitor is enough, no raw manifest needed.
          metrics:
            serviceMonitor:
              enabled: true
          startupProbe:
            enabled: true
            failureThreshold: 30
            periodSeconds: 30
          # QDRANT__SERVICE__API_KEY is deliberately unset: the application
          # release deployed here cannot send a key, so requiring one made every
          # call fail and ingestion stop. The network policy below is what keeps
          # the service private meanwhile. Restore the env block below once the
          # application can authenticate — the secret stays provisioned for it.
          #
          #   env:
          #     - name: QDRANT__SERVICE__API_KEY
          #       valueFrom:
          #         secretKeyRef: { name: qdrant-api-key, key: api-key }
          #
          # Set on the pod, not through the chart's apiKey value: that branch
          # reads the secret with lookup, which is empty under client-side
          # rendering, and dereferences readOnlyApiKey when it is unset.
    # The policy is a manifest, so it renders through the raw chart rather than
    # as values for the qdrant chart.
    - chart: raw
      repoURL: https://bedag.github.io/helm-charts
      targetRevision: 2.0.0
      helm:
        releaseName: qdrant-network-policy
        valueFiles:
          - $values/06-applications/sbx/value-overlays/qdrant/network-policy.yaml
