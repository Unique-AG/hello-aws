# The per-app chart: the generic charts have no _sandbox-config template, so they
# drop sandboxConfig and Conduct cannot be enabled.
spec:
  name: assistants-core
  autoSync: false
  sources:
    - repoURL: uniquecr.azurecr.io
      chart: helm/assistants-core
      targetRevision: "2026.42.10"
      helm:
        releaseName: assistants-core
        valueFiles:
          - $values/06-applications/defaults/ai-services/assistants-core.yaml
          - $values/06-applications/sbx/value-overlays/ai-services/assistants-core.yaml
        valuesObject:
          image:
            tag: "2026.42.10"
