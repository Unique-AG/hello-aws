# ai-service is deprecated; backend-service is its successor. releaseName stays
# assistants-core because chat calls it at that Service name on 8081.
spec:
  name: assistants-core
  autoSync: false
  sources:
    - repoURL: ghcr.io/unique-ag/helm-charts
      chart: backend-service
      targetRevision: 10.5.1
      helm:
        releaseName: assistants-core
        valueFiles:
          - $values/06-applications/defaults/ai-services/assistants-core.yaml
          - $values/06-applications/sbx/value-overlays/ai-services/assistants-core.yaml
        valuesObject:
          image:
            tag: "2026.42.10"
