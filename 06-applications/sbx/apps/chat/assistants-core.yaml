# ai-service 3.0.0 is deprecated and names backend-service as its successor;
# the other services here already use it. releaseName stays assistants-core
# because chat calls http://assistants-core.unique.svc:8081/core.
spec:
  name: assistants-core
  autoSync: false
  sources:
    - repoURL: ghcr.io/unique-ag/helm-charts
      chart: backend-service
      targetRevision: 10.5.1
      helm:
        releaseName: assistants-core
        valueFiles:
          - $values/06-applications/defaults/ai-services/assistants-core.yaml
          - $values/06-applications/sbx/value-overlays/ai-services/assistants-core.yaml
        valuesObject:
          image:
            tag: "2026.42.10"
