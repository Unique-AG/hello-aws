# cloud-api-adaptor: launches one EC2 instance per sandbox so Conduct gets a VM
# boundary. Chart vendored in 06-applications/charts/peerpods -- see its
# values.yaml for why.
spec:
  name: peer-pods
  autoSync: false
  syncOptions:
    - SkipDryRunOnMissingResource=true
  sources:
    - repoURL: <GITHUB_REPO_URL>
      targetRevision: <GIT_TARGET_REVISION>
      path: 06-applications/charts/peerpods
      helm:
        releaseName: peer-pods
        valueFiles:
          - $values/06-applications/sbx/value-overlays/conduct/peer-pods.yaml
