# The sbx namespace and the RuntimeClass every Sandbox pod requests. In the
# system group so both exist before the conduct group syncs into sbx.
spec:
  name: sbx-namespace
  autoSync: false
  sources:
    - chart: raw
      repoURL: "https://bedag.github.io/helm-charts"
      targetRevision: 2.0.0
      helm:
        releaseName: sbx-namespace
        valuesObject:
          resources:
            - apiVersion: v1
              kind: Namespace
              metadata:
                name: sbx
                labels:
                  kubernetes.io/metadata.name: sbx
            # Routes to the kata-remote shim that kata-deploy registers, so a
            # sandbox gets its own VM. Never point this at runc: the name would
            # assert a boundary the handler does not provide, and that is the one
            # misconfiguration that looks like success.
            - apiVersion: node.k8s.io/v1
              kind: RuntimeClass
              metadata:
                name: kata-vm-isolation
              handler: kata-remote
