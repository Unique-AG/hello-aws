# The sbx namespace and the RuntimeClass every Sandbox pod requests. In the
# system group so both exist before the conduct group syncs into sbx.
spec:
  name: sbx-namespace
  autoSync: true
  sources:
    - chart: raw
      repoURL: "https://bedag.github.io/helm-charts"
      targetRevision: 2.0.0
      helm:
        releaseName: sbx-namespace
        valuesObject:
          resources:
            - apiVersion: v1
              kind: Namespace
              metadata:
                name: sbx
                labels:
                  kubernetes.io/metadata.name: sbx
            # kata-remote is the shim kata-deploy registers; test-charts.sh rejects runc here.
            - apiVersion: node.k8s.io/v1
              kind: RuntimeClass
              metadata:
                name: kata-vm-isolation
              handler: kata-remote
              # Only the sandbox pool has the shim. A toleration permits that node,
              # it does not select it, so without this pods land anywhere and fail.
              scheduling:
                nodeSelector:
                  katacontainers.io/kata-runtime: "true"
                  kata-deploy.katacontainers.io/default: "true"
                tolerations:
                  - key: workload
                    operator: Equal
                    value: sandbox
                    effect: NoSchedule
