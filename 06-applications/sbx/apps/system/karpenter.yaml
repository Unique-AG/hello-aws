# Karpenter provisions the general node pools. The Kata sandbox hosts stay on
# a managed node group (CA 9.3), so this cluster is deliberately mixed.
spec:
  name: karpenter
  autoSync: true
  syncOptions:
    - ServerSideApply=true
  sources:
    - chart: karpenter
      repoURL: public.ecr.aws/karpenter
      # Kubernetes 1.35 needs >= 1.9 per Karpenter's matrix; 1.36 wants 1.13.
      targetRevision: 1.15.3
      helm:
        releaseName: karpenter
        valueFiles:
          - $values/06-applications/sbx/value-overlays/karpenter/karpenter.yaml
    # A second source; Argo CD does not order them, so the first sync may
    # retry until the chart's CRDs exist.
    - chart: raw
      repoURL: "https://bedag.github.io/helm-charts"
      targetRevision: 2.0.0
      helm:
        releaseName: karpenter-node-pools
        valueFiles:
          - $values/06-applications/sbx/value-overlays/karpenter/node-pools.yaml
