# AWS-specific configuration for Docling ingestor service

image:
  repository: <ECR_REGISTRY_PRIMARY>/ingestors

env:
  REDIS_PORT: "6380"
  REDIS_USE_TLS: "true"

secretProvider: null

podSecurityContext:
  fsGroup: 1000

routes:
  skipCrdCheck: true

serviceAccount:
  create: true

nodeSelector: null

podAnnotations:
  reloader.stakater.com/auto: "true"

extraEnvSecrets:
  - ingestor-secrets

# CA 9.4's floor for a non-production installation.
keda:
  minReplicaCount: 2

# Only to clear the chart's PDB condition; KEDA owns the count.
replicaCount: 2
