# AWS-specific configuration for Docling ingestor service

image:
  repository: 217381566492.dkr.ecr.us-east-1.amazonaws.com/uniquecr/ingestors

env:
  REDIS_PORT: "6380"
  REDIS_USE_TLS: "true"

secretProvider: null

podSecurityContext:
  fsGroup: 1000

routes:
  skipCrdCheck: true

serviceAccount:
  create: true

nodeSelector: null

podAnnotations:
  reloader.stakater.com/auto: "true"

extraEnvSecrets:
  - ingestor-secrets
