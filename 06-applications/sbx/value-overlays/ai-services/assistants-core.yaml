# Assistants Core AI service configuration (AWS sbx)
# Uses AWS Bedrock for LLM inference and S3 for storage

env:
  CORS_ALLOWED_ORIGINS: https://hello.aws.unique.dev
  ZITADEL_PROJECT_ID: "397413297122445183"
  UNIQUE_INSTALLATION_ID: hello.aws.unique.dev
  AWS_REGION: us-east-1
  LLM_PROVIDER: bedrock
  STORAGE_PROVIDER: s3

image:
  repository: 217381566492.dkr.ecr.us-east-1.amazonaws.com/uniquecr/ai-service-assistants-core

replicaCount: 1

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 1Gi

secretProvider: null

serviceAccount:
  enabled: true
  workloadIdentity:
    enabled: false

podAnnotations:
  reloader.stakater.com/auto: "true"

nodeSelector: null

extraEnvSecrets:
  - assistants-core-secrets

# Conduct stays off: no published chart declares sandboxConfig. The values block
# is in the PR that removed it and in the Conduct LLD, section 11.4.
