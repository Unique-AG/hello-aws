# Assistants Core AI service configuration (AWS sbx)
# Uses AWS Bedrock for LLM inference and S3 for storage

env:
  CORS_ALLOWED_ORIGINS: https://hello.aws.unique.dev
  ZITADEL_PROJECT_ID: "397413297122445183"
  UNIQUE_INSTALLATION_ID: hello.aws.unique.dev
  AWS_REGION: us-east-1
  LLM_PROVIDER: bedrock
  # Unset, unique_toolkit falls back to AZURE_GPT_4o_2024_1120, which LiteLLM
  # does not serve here, and chat crash-loops resolving its default model.
  DEFAULT_LANGUAGE_MODEL: "litellm:anthropic-claude-opus-5-5"
  STORAGE_PROVIDER: s3

image:
  # The chart renders registry/repository and stamps a digest for the ACR path,
  # which does not apply here; pull by tag from the pull-through cache.
  registry: 217381566492.dkr.ecr.us-east-1.amazonaws.com/uniquecr
  repository: ai-service-assistants-core
  useDigest: false

replicaCount: 1

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 1Gi

secretProvider: {}

serviceAccount:
  enabled: true
  workloadIdentity:
    enabled: false

podAnnotations:
  reloader.stakater.com/auto: "true"

nodeSelector: {}

extraEnvSecrets:
  - assistants-core-secrets

# Turns Conduct on: assistants-core claims a sandbox per agent run.
sandboxConfig:
  enabled: true
  namespace: sbx
  # The boundary: unique-polyagent-001 (peer pods) or unique-polyagent-001-fargate (Fargate).
  template: unique-polyagent-001
  router:
    host:
      fromKubernetesService:
        name: agent-sandbox-controller-router-svc
        namespace: unique
        podPort: 8080
        podSelectorLabels:
          k8s:app.kubernetes.io/name: agent-sandbox-controller
          k8s:app.kubernetes.io/component: router
    port: 8080
