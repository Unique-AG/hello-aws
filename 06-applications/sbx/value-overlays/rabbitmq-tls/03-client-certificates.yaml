# One certificate per service. The common name IS the RabbitMQ user name:
# the broker reads the identity off the certificate, so a wrong CN is a wrong user.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rabbitmq-client-app-repository
  namespace: unique
spec:
  secretName: rabbitmq-client-app-repository-tls
  duration: 2160h # 90 days
  renewBefore: 360h
  commonName: app-repository
  usages:
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: rabbitmq-ca
    kind: Issuer
