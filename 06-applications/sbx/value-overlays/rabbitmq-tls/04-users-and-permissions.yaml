# Each service gets a user named after its certificate's common name, and
# no password at all: an empty passwordHash creates a passwordless user, so
# the certificate is the only way in. Permissions stay wide until per-service
# scopes are agreed.
#
# The operator reads the import secret once, at user creation, and does not
# watch it afterwards — changing one later does not change the live user.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-user-app-repository
  namespace: unique
  labels:
    rabbitmq.com/topology-operator: "true"
stringData:
  username: app-repository
  passwordHash: ""
---
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: app-repository
  namespace: unique
spec:
  tags: []
  # Without this the operator invents a random username and the certificate's
  # common name matches no user, so every login is refused.
  importCredentialsSecret:
    name: rabbitmq-user-app-repository
  rabbitmqClusterReference:
    name: rabbitmqcluster-chat
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: app-repository
  namespace: unique
spec:
  vhost: "/"
  userReference:
    name: app-repository
  permissions:
    write: ".*"
    configure: ".*"
    read: ".*"
  rabbitmqClusterReference:
    name: rabbitmqcluster-chat
---
