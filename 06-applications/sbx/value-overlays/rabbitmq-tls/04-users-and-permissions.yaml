# Users with no password: the certificate is the credential, so there is no
# secret to rotate or leak. Permissions stay wide until per-service scopes are agreed.
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: app-repository
  namespace: unique
spec:
  tags: []
  rabbitmqClusterReference:
    name: rabbitmqcluster-chat
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: app-repository
  namespace: unique
spec:
  vhost: "/"
  userReference:
    name: app-repository
  permissions:
    write: ".*"
    configure: ".*"
    read: ".*"
  rabbitmqClusterReference:
    name: rabbitmqcluster-chat
---
