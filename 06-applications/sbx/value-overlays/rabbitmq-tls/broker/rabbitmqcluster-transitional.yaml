# The broker with TLS added and nothing taken away. This exists so certificate
# sign-in can be proved while passwords still work: the live broker has no
# spec.tls at all, so without this there is no amqps listener to test against
# and the first real test of EXTERNAL would be the cutover itself.
#
# Committed over ../../rabbitmq/rabbitmq-cluster.yaml at step 4, replaced by
# rabbitmqcluster-hardened.yaml at step 6. Going through Git matters: the
# Application that owns that path self-heals, so a hand-applied change reverts.
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmqcluster-chat
  namespace: unique
spec:
  image: <ECR_REGISTRY_THIRDPARTY_BARE>/public.ecr.aws/docker/library/rabbitmq:3.13-management
  replicas: 1
  tls:
    secretName: rabbitmqcluster-chat-server-tls
    caSecretName: rabbitmq-ca-tls
    # The difference from 05: plaintext stays open, so a failed certificate
    # login costs nothing and every existing caller keeps working.
    disableNonTLSListeners: false
  resources:
    requests:
      cpu: '200m'
      memory: 1Gi
    limits:
      memory: 1Gi
  secretBackend:
    externalSecret:
      name: rabbitmqcluster-chat-default-user
  rabbitmq:
    additionalPlugins:
      - rabbitmq_auth_mechanism_ssl
      - rabbitmq_prometheus
    additionalConfig: |
      cluster_partition_handling = pause_minority
      disk_free_limit.relative = 1.0
      collect_statistics_interval = 10000
      # Both mechanisms, so certificates and passwords are accepted side by side.
      auth_mechanisms.1 = PLAIN
      auth_mechanisms.2 = AMQPLAIN
      auth_mechanisms.3 = EXTERNAL
      ssl_cert_login_from = common_name
      # verify_peer without fail_if_no_peer_cert: a certificate is checked when
      # offered, and a client that offers none can still sign in with a password.
      ssl_options.verify = verify_peer
      ssl_options.fail_if_no_peer_cert = false
      prometheus.return_per_object_metrics = true
  persistence:
    storageClassName: gp3
    storage: "10Gi"
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - rabbitmqcluster-chat
          topologyKey: kubernetes.io/hostname
  override:
    statefulSet:
      spec:
        template:
          spec:
            containers:
            - name: rabbitmq
              securityContext:
                privileged: false
                allowPrivilegeEscalation: false
            initContainers:
            - name: setup-container
              securityContext:
                privileged: false
                allowPrivilegeEscalation: false
            topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: "topology.kubernetes.io/zone"
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: rabbitmqcluster-chat
