# Chat web app configuration (AWS sbx)

env:
  FEATURE_FLAG_ENABLE_THINKING_STEPS_UN_13848: "true"
  NET_PROMOTER_SCORE_UI_ENABLED: "true"
  FILE_TYPES_DOCUMENT_TRANSLATOR: "docx,xls,pptx"
  MAX_FILE_SIZE_IN_MB: "200"
  SELF_URL: https://<DOMAIN_BASE>/chat
  SPEECH_BACKEND_API_URL: wss://<DOMAIN_API>/speech/ws/v1/speech-to-text

image:
  repository: <ECR_REGISTRY_PRIMARY>/web-app-chat
