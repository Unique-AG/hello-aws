# cloud-api-adaptor for AWS. Credentials come from EKS Pod Identity, bound in
# 05-compute/terraform/iam.tf for both this chart's service accounts.

provider: aws

# Through the ECR pull-through cache: the S3 gateway endpoint policy admits
# ECR's layer bucket, not the upstream registries' own S3 blob stores.
image:
  name: 217381566492.dkr.ecr.us-east-1.amazonaws.com/quay.io/confidential-containers/cloud-api-adaptor

providerConfigs:
  aws:
    AWS_REGION: "us-east-1"
    AWS_SUBNET_ID: "subnet-0e11bb790e4d989fc"
    # The pod VM group, not the node group: the VM's own ENI needs only the
    # pod-network tunnel, the adaptor channel and its image pull.
    AWS_SG_IDS: "sg-05a7811bba23514c9"
    # Not built by Terraform: see the pod VM image section of 05-compute/README.md.
    PODVM_AMI_ID: "ami-051f1906ef8ed2590"
    # Matches the sandbox node pool.
    PODVM_INSTANCE_TYPE: "m6i.large"
    # The tag the IAM policy conditions on for both launch and termination.
    TAGS: "PeerPod=true"
    # The boundary here is the VM, not memory encryption; CVM needs SEV-SNP
    # capable instance types.
    DISABLECVM: "true"
    PEERPODS_LIMIT_PER_NODE: "10"

daemonset:
  # The adaptor's entrypoint requires a role ARN and a web identity token file;
  # EKS injects both from this annotation. Pod Identity alone does not set them.
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: <PEER_PODS_ROLE_ARN>
  # Upstream hardcodes node.kubernetes.io/worker, which EKS will not set.
  nodeSelector:
    workload: sandbox
  tolerations:
    - key: workload
      value: sandbox
      effect: NoSchedule

# Installed separately at 4.1.0 with only the remote shim; the chart's bundled
# 4.0.0 copy would contend over containerd configuration.
kata-deploy:
  enabled: false

# Reclaims pod VMs whose sandbox went away, so a failed teardown does not leak
# EC2 instances. Has its own service account, hence the second association.
resourceCtrl:
  enabled: true
  image:
    repository: 217381566492.dkr.ecr.us-east-1.amazonaws.com/quay.io/confidential-containers/peerpod-ctrl
  authProxy:
    image: 217381566492.dkr.ecr.us-east-1.amazonaws.com/registry.k8s.io/kubebuilder/kube-rbac-proxy:v0.14.0@sha256:e2670fb55b3211fb101f17afa3d81ba816d7c0b76ed31bd3d93fa2affb491595

# Off: a cluster-wide MutatingWebhookConfiguration with failurePolicy Fail on
# every pod CREATE outside kube-system. Nothing here needs its extended-resource
# mutation, and an unschedulable webhook would stop all pod creation.
webhook:
  enabled: false
