# cloud-api-adaptor for AWS. Credentials come from EKS Pod Identity, bound to
# this chart's `cloud-api-adaptor` service account in 05-compute/terraform/iam.tf.

provider: aws

providerConfigs:
  aws:
    AWS_REGION: "<AWS_REGION>"
    AWS_SUBNET_ID: "<SANDBOX_SUBNET_ID>"
    AWS_SG_IDS: "<EKS_NODE_SECURITY_GROUP_ID>"
    # Required, and deliberately empty: built out of band from the upstream
    # podvm image-builder, with no published AMI to point at. Fill it in here
    # before syncing this application; until then CAA will not start.
    PODVM_AMI_ID: ""
    PODVM_INSTANCE_TYPE: "m6a.large"
    # The tag the pod VM IAM policy conditions on, for both launch and
    # termination. Changing it without changing that policy breaks both.
    TAGS: "PeerPod=true"
    # Non-confidential pod VMs: the boundary here is the VM, not memory
    # encryption. Enabling CVM requires SEV-SNP capable instance types.
    DISABLECVM: "true"
    PEERPODS_LIMIT_PER_NODE: "10"

# kata-deploy is installed separately at 4.1.0 with only the remote shim, so the
# chart's bundled 4.0.0 copy must stay off or the two would fight over
# containerd config.
kata-deploy:
  enabled: false

# Reclaims pod VMs whose sandbox went away, so a failed teardown does not leak
# EC2 instances.
resourceCtrl:
  enabled: true

daemonset:
  # Pod Identity binds by namespace and service account, so no annotation is
  # needed here; the agent addon injects the credentials.
  serviceAccount:
    annotations: {}
