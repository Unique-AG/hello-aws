# sbx-gateway — the egress proxy Conduct sandboxes are forced through at
# sbx-gateway.sbx.svc:3128; without it they have no outbound path.

image:
  # Split explicitly: the chart defaults registry to the ACR host.
  registry: <ECR_REGISTRY_PRIMARY>
  repository: unique/sbx-gateway
  # By tag: the chart's digest names the ACR path, not the ECR one.
  useDigest: false
  tag: "2026.37.0"

# Nodes authenticate to ECR by IAM.
imagePullSecrets: []

replicaCount: 2

nodeSelector:
  scalability: steady
  lifecycle: persistent

# 2026.37.0 flipped the PDB default to minAvailable: 1, which blocks node
# drains. Nulling it is required; the chart rejects both fields set.
pdb:
  minAvailable: null
  maxUnavailable: 1

# Chart-generated CA; sbx-templates mounts it. Rotate by deleting the Secret.
mitmCa:
  enabled: true
  secretName: egress-mitm-ca
  validityDays: 3650

internalServices:
  dependencies:
    chat:
      namespace: unique
    ingestion:
      namespace: unique
