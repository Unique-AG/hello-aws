# sbx-gateway — the egress proxy Conduct sandboxes are forced through at
# sbx-gateway.sbx.svc:3128; without it they have no outbound path.

image:
  # Split explicitly: the chart defaults registry to the ACR host.
  registry: <ECR_REGISTRY_PRIMARY>
  repository: unique/sbx-gateway
  # By tag: the chart's digest names the ACR path, not the ECR one. The tag
  # itself is release content and lives in the app spec.
  useDigest: false

# Nodes authenticate to ECR by IAM.
imagePullSecrets: []

replicaCount: 2

nodeSelector:
  scalability: steady
  lifecycle: persistent

# Swaps the chart's minAvailable: 1 (it rejects both set) so drains stay one pod
# at a time as the HPA scales out. Verified to render at 2026.42.10.
pdb:
  minAvailable: null
  maxUnavailable: 1

# Chart-generated CA; sbx-templates mounts it. Rotate by deleting the Secret.
mitmCa:
  enabled: true
  secretName: egress-mitm-ca
  validityDays: 3650

internalServices:
  dependencies:
    chat:
      namespace: unique
    ingestion:
      namespace: unique
