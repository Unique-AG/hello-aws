# sbx-gateway — the egress proxy Conduct sandboxes are forced through at
# sbx-gateway.sbx.svc:3128; without it they have no outbound path.

image:
  # Split explicitly: the chart defaults registry to the ACR host.
  registry: <ECR_REGISTRY_PRIMARY>
  repository: unique/sbx-gateway
  # By tag: the chart's digest names the ACR path, not the ECR one. The tag
  # itself is release content and lives in the app spec.
  useDigest: false

# Nodes authenticate to ECR by IAM.
imagePullSecrets: []

replicaCount: 2

nodeSelector:
  scalability: steady
  lifecycle: persistent

# Swaps the chart's minAvailable: 1 (it rejects both set) so drains stay one pod
# at a time as the HPA scales out. Verified to render at 2026.42.10.
pdb:
  minAvailable: null
  maxUnavailable: 1

# Chart-generated CA; sbx-templates mounts it. Rotate by deleting the Secret.
mitmCa:
  enabled: true
  secretName: egress-mitm-ca
  validityDays: 3650

# The generic charts name these backend-service-<name>, on port 80; the defaults are node-*.
internalServices:
  dependencies:
    chat:
      name: backend-service-chat
      namespace: unique
      servicePort: 80
    ingestion:
      name: backend-service-ingestion
      namespace: unique
      servicePort: 80

# The chat API hands the agent a public upload URL, so the generated-file PUT
# goes to the API host rather than the internal Service the other calls use.
egressGateway:
  allowHosts:
    <DOMAIN_API>: true
  allowPaths:
    <DOMAIN_API>:
      - /scoped/ingestion/upload
  allowMethods:
    <DOMAIN_API>:
      - PUT
  # Keyed by host: without this the sandbox would reach that upstream without
  # the identity the gateway injects from the source pod's own labels.
  injectRequestHeaders:
    <DOMAIN_API>:
      x-user-id: "${context:source_pod.labels.unique.app/user-id}"
      x-company-id: "${context:source_pod.labels.unique.app/company-id}"
