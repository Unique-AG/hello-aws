# grafana/alloy is published to Docker Hub only, whose layer blobs sit in
# in-region S3; the mirror puts a copy in this account's ECR instead.
image:
  registry: <ECR_REGISTRY_THIRDPARTY_BARE>
  repository: mirror/grafana/alloy

serviceMonitor:
  enabled: true

controller:
  priorityClassName: system-node-critical
  tolerations:
    - key: scalability
      operator: Exists
      effect: NoSchedule
    - key: lifecycle
      operator: Exists
      effect: NoSchedule

alloy:
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  mounts:
    varlog: true
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  extraEnv:
    - name: LOKI_ENDPOINT
      value: "http://loki.unique.svc.cluster.local:3100/loki/api/v1/push"
  configMap:
    create: false
    name: alloy-config
