# Observability ExternalSecrets for AWS
# Provides secrets for AlertManager and Grafana

resources:
  # No AlertManager webhook here: its source secret is optional and unset, so
  # this ExternalSecret could never sync and its mount blocked the pod.

  # Grafana admin credentials
  - apiVersion: external-secrets.io/v1beta1
    kind: ExternalSecret
    metadata:
      name: grafana-admin-credentials
      namespace: unique
    spec:
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: aws-secrets-manager
      target:
        name: grafana-admin-credentials
        template:
          data:
            admin-user: admin
            admin-password: "{{ .password }}"
      data:
        - secretKey: password
          remoteRef:
            key: grafana-admin-password
