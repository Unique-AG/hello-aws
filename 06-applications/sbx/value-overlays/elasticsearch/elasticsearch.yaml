resources:
  # The role the ingestion service runs as. ECK reads this file under the key
  # roles.yml; it holds no credential, but ECK takes roles from a Secret only.
  - apiVersion: v1
    kind: Secret
    metadata:
      name: elasticsearch-ingestion-roles
      namespace: unique
    stringData:
      roles.yml: |
        ingestion_app:
          # The client pings HEAD / before it will register its search adapter.
          # Named as the one action, so cluster state and _cat stay refused.
          cluster:
            - "cluster:monitor/main"
          indices:
            - names: ["chunks_*", "chat-chunks*"]
              privileges:
                - create_index
                - manage
                - read
                - write
                - view_index_metadata

  - apiVersion: elasticsearch.k8s.elastic.co/v1
    kind: Elasticsearch
    metadata:
      name: elasticsearch-ingestion
    spec:
      version: 9.0.2
      auth:
        # Ingestion signs in as its own user now, so the superuser has no caller
        # left. ECK keeps its own internal users, which this does not touch.
        disableElasticUser: true
        roles:
          - secretName: elasticsearch-ingestion-roles
        fileRealm:
          - secretName: elasticsearch-ingestion-user
      nodeSets:
        - name: default
          count: 1 # In production, run cluster with 3 nodes
          config:
            node.store.allow_mmap: false
          podTemplate:
            spec:
              containers:
                - name: elasticsearch
                  resources:
                    requests:
                      memory: 2Gi
                      cpu: 0.5
                    limits:
                      memory: 2Gi
                      cpu: 0.5
          volumeClaimTemplates:
            - metadata:
                name: elasticsearch-data
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 10Gi
                storageClassName: gp3
