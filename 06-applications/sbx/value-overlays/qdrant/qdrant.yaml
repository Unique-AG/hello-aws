# Qdrant Vector Database for AWS EKS
# Mirrored: Qdrant publishes only to Docker Hub.
replicaCount: 1

image:
  # No digest: the chart runs semverCompare on this tag. The mirror repository
  # has immutable tags, so v1.13.1-unprivileged cannot move.
  repository: 217381566492.dkr.ecr.us-east-1.amazonaws.com/mirror/qdrant/qdrant
  tag: v1.13.1
  useUnprivilegedImage: true

# nodeSelector removed - sbx nodes don't have these labels

resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    memory: 2Gi

persistence:
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClassName: gp3

startupProbe:
  enabled: true
  failureThreshold: 30
  periodSeconds: 30

service:
  type: ClusterIP
