global:
  defaultStorageClass: gp3
  security:
    allowInsecureImages: true # see docs/security-baseline.md

useCertManager: true

clusterOperator:
  image:
    registry: <ECR_REGISTRY_THIRDPARTY_BARE>
    repository: mirror/bitnamilegacy/rabbitmq-cluster-operator
    tag: 2.10.0-debian-12-r0
  watchAllNamespaces: false
  watchNamespaces:
    - unique

msgTopologyOperator:
  image:
    registry: <ECR_REGISTRY_THIRDPARTY_BARE>
    repository: mirror/bitnamilegacy/rmq-messaging-topology-operator
    tag: 1.14.2-debian-12-r5
