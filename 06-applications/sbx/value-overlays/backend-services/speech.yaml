# Speech backend service configuration (AWS sbx)
# Uses AWS Transcribe for speech-to-text

image:
  repository: 217381566492.dkr.ecr.us-east-1.amazonaws.com/uniquecr/backend-service-speech

replicaCount: 2

resources:
  limits:
    cpu: 100m
    memory: 300Mi
  requests:
    cpu: 100m
    memory: 300Mi

env:
  SPEECH_PROVIDER: aws-transcribe
  AWS_REGION: us-east-1

serviceAccount:
  enabled: true
