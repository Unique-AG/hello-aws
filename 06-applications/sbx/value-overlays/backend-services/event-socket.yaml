# Event Socket backend service configuration (AWS sbx)

image:
  repository: <ECR_REGISTRY_PRIMARY>/backend-service-event-socket

routes:
  gateway:
    namespace: unique
  hostname: <DOMAIN_API>
  pathPrefix: /event-socket
  paths:
    versioned:
      enabled: true
    probe:
      enabled: true

# One shared AMQP queue, so a second replica consumes events meant for a
# client held by the first. See 06-applications/scheduling-exceptions.yaml.
replicaCount: 1
