# Event Socket backend service configuration (AWS sbx)

image:
  repository: 217381566492.dkr.ecr.us-east-1.amazonaws.com/uniquecr/backend-service-event-socket

routes:
  gateway:
    namespace: unique
  hostname: api.hello.aws.unique.dev
  pathPrefix: /event-socket
  paths:
    versioned:
      enabled: true
    probe:
      enabled: true

# One shared AMQP queue, so a second replica consumes events meant for a
# client held by the first. See 06-applications/scheduling-exceptions.yaml.
replicaCount: 1
