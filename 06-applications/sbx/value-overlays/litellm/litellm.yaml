# LiteLLM Proxy for AWS EKS
# Uses AWS Bedrock via EKS Pod Identity (no static credentials)
# Database: Aurora PostgreSQL, Cache: ElastiCache Redis (TLS)

replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm-database
  # Filters the anthropic-beta values per provider; the pinned 1.81.3 forwarded
  # them verbatim, so one value the model host rejects failed the whole request.
  tag: "litellm_stable_release_branch_1_81_14-v1.81.14-stable"
  pullPolicy: IfNotPresent

# Service account for Bedrock access (Pod Identity association managed by Terraform)
serviceAccount:
  create: true

podAnnotations:
  reloader.stakater.com/auto: "true"

resources:
  requests:
    cpu: 250m
    memory: 500Mi
  limits:
    memory: 1Gi

# Database config - secrets injected via secretFrom
db:
  deployStandalone: false
  useExisting: false

# Inject litellm K8s secret (DATABASE_URL, PROXY_MASTER_KEY, LITELLM_SALT_KEY)
secretFrom:
  name: litellm

# Environment variables (ConfigMap)
env:
  # Use the filter table shipped in the image. Left unset it is fetched from the
  # upstream default branch at boot, which would drift between restarts.
  LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS: "True"
  LITELLM_LOG: "INFO"
  LITELLM_MODE: PRODUCTION
  REDIS_URL: "<REDIS_URL>"

# Migration job for Prisma schema
hooks:
  migration:
    enabled: true
    command: |
      python litellm/proxy/prisma_migration.py

# Proxy configuration
proxy_config:
  model_list:
    # No Anthropic or OpenAI model is served on-demand in-region, so the geo-prefixed
    # cross-region profile is the narrowest scope available.
    - model_name: anthropic-claude-opus-5-5
      litellm_params: &claude-opus-5-5
        model: bedrock/<BEDROCK_GEO_PREFIX>.anthropic.claude-opus-5-5
        aws_region_name: <AWS_REGION>
        max_tokens: 20000
        additional_drop_params: ["temperature", "top_p", "top_k"]

    # GPT-6 tiers: Astra is the most capable, Sol covers agentic and coding work,
    # Luna is for high-volume tasks. All three reject temperature and top_p.
    - model_name: openai-gpt-6-astra
      litellm_params: &gpt-6-astra
        model: bedrock/<BEDROCK_GEO_PREFIX>.openai.gpt-6-astra
        aws_region_name: <AWS_REGION>
        max_tokens: 20000
        additional_drop_params: ["temperature", "top_p", "top_k"]

    - model_name: openai-gpt-6-sol
      litellm_params: &gpt-6-sol
        model: bedrock/<BEDROCK_GEO_PREFIX>.openai.gpt-6-sol
        aws_region_name: <AWS_REGION>
        max_tokens: 20000
        additional_drop_params: ["temperature", "top_p", "top_k"]

    - model_name: openai-gpt-6-luna
      litellm_params: &gpt-6-luna
        model: bedrock/<BEDROCK_GEO_PREFIX>.openai.gpt-6-luna
        aws_region_name: <AWS_REGION>
        max_tokens: 20000
        additional_drop_params: ["temperature", "top_p", "top_k"]

    # Native vendor IDs: Claude Code in Conduct sandboxes calls its sub-agents and
    # background tasks by these, through chat's Anthropic proxy.
    - model_name: claude-opus-5-5
      litellm_params: *claude-opus-5-5
    - model_name: gpt-6-astra
      litellm_params: *gpt-6-astra
    - model_name: gpt-6-sol
      litellm_params: *gpt-6-sol
    - model_name: gpt-6-luna
      litellm_params: *gpt-6-luna

    # node-chat's benchmarking module builds a client for AZURE_GPT_4o_2024_1120
    # in onApplicationBootstrap unconditionally, so chat cannot start without it.
    - model_name: gpt-4o-2024-11-20
      litellm_params: *claude-opus-5-5

    # Cohere Embed v4 (1536 dims), reached through the ingestion service's Azure
    # OpenAI SDK as a deployment name.
    # model: sets provider mapping, model_id: sets Bedrock inference profile ARN
    - model_name: text-embedding-cohere-embed-v4
      litellm_params:
        model: bedrock/cohere.embed-v4:0
        model_id: arn:aws:bedrock:<AWS_REGION>:<AWS_ACCOUNT_ID>:application-inference-profile/<BEDROCK_COHERE_EMBED_V4_PROFILE_ID>
        aws_region_name: <AWS_REGION>

  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    alerting: []
    proxy_batch_write_at: 60
    database_connection_pool_limit: 10
    disable_spend_logs: false
    disable_error_logs: false

  litellm_settings:
    modify_params: true
    drop_params: true
    turn_off_message_logging: false
    max_budget: 10000
    budget_duration: 30d
    json_logs: true
    cache: true
    cache_params:
      type: redis
      namespace: "litellm.caching.caching"
    redact_messages_in_exceptions: true
    request_timeout: 600
    set_verbose: false

securityContext:
  allowPrivilegeEscalation: false

ingress:
  enabled: false
