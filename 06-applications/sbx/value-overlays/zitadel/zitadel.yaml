# Zitadel for AWS EKS
# Using public images
chownImage:
  repository: alpine
  tag: "3.19"
image:
  repository: ghcr.io/zitadel/zitadel
  # Pinned ahead of chart 8.13.1's appVersion (v2.67.2) to match the release.
  # No chart ever shipped a v3 appVersion; upstream went 8.x (v2) -> 9.x (v4).
  tag: v3.4.15
nodeSelector:
  scalability: steady
  lifecycle: persistent
ingress:
  enabled: false
securityContext:
  allowPrivilegeEscalation: false
env:
  - name: ZITADEL_DATABASE_POSTGRES_USER_USERNAME
    value: z1t4d3l
  - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: systemzitadel
        key: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
  - name: ZITADEL_DATABASE_POSTGRES_HOST
    valueFrom:
      secretKeyRef:
        name: systemzitadel
        key: ZITADEL_DATABASE_POSTGRES_HOST
  - name: ZITADEL_DATABASE_POSTGRES_PORT
    valueFrom:
      secretKeyRef:
        name: systemzitadel
        key: ZITADEL_DATABASE_POSTGRES_PORT
  - name: ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME
    valueFrom:
      secretKeyRef:
        name: systemzitadel
        key: ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME
  - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: systemzitadel
        key: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
  # Only the setup job consumes FirstInstance, but the chart renders a single
  # `env:` list into the setup job, the init job and the server Deployment.
  - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: zitadel-bootstrap
        key: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD
zitadel:
  dbSslCaCrtSecret: zitadel-certs
  masterkeySecretName: systemzitadel
  secretConfig:
    Database:
      postgres:
        Database: zitadel
        MaxOpenConns: 50
        MaxIdleConns: 10
        MaxConnLifetime: 1h
        MaxConnIdleTime: 5m
        Options:
        User:
          SSL:
            Mode: verify-full
            RootCert: /.secrets/ca.crt
            Cert:
            Key:
        Admin:
          SSL:
            Mode: verify-full
            RootCert: /.secrets/ca.crt
            Cert:
            Key:
    FirstInstance:
      Org:
        Name: Cluster IAM
        Human:
          Username: root@cluster-iam.localhost
          # Password is NOT set here. It comes from the zitadel-bootstrap
          # ExternalSecret via ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD (see
          # env: above); Zitadel env vars override the config tree, the same
          # mechanism the database credentials already use.
          #
          # Do not drop that env entry, and never let it resolve to an empty
          # string: Zitadel's setup defaults ship a well-known literal for this
          # field, and viper treats an empty env var as unset, so either case
          # silently bootstraps the IAM_OWNER admin with a password anyone can
          # look up.
          # The value must also satisfy the default PasswordComplexityPolicy
          # (>=8 chars, lower + upper + number + symbol) or setup fails.
          #
          # Spelled out because it is what makes the Secrets Manager value
          # single-use: the operator must change it at first login, after
          # which the stored value no longer matches the account.
          PasswordChangeRequired: true
  configmapConfig:
    ExternalDomain: <DOMAIN_IDENTITY>
    ExternalPort: 443
    ExternalSecure: true
    LogStore:
      Access:
        Stdout:
          Enabled: true
    TLS:
      Enabled: false
    UserAgentCookie:
      Name: uniqueid.useragent
    Login:
      LanguageCookieName: uniqueid.login.lang
      CSRFCookieName: uniqueid.login.csrf
    Quotas:
      Access:
        ExhaustedCookieKey: uniqueid.quota.exhausted
    SystemDefaults:
      Multifactors:
        OTP:
          Issuer: UNIQUE
      KeyConfig:
        PrivateKeyLifetime: 2160h
        PublicKeyLifetime: 8760h
    DefaultInstance:
      InstanceName: UNIQUE
      DefaultLanguage: en
      DomainPolicy:
        UserLoginMustBeDomain: false
        ValidateOrgDomain: false
      LoginPolicy:
        AllowDomainDiscovery: true
        AllowRegister: false
      PrivacyPolicy:
        TOSLink: https://www.unique.ch/terms
        PrivacyLink: https://www.unique.ch/privacy
        SupportEmail: support@unique.ch
        HideLoginNameSuffix: true
        ErrorMsgPopup: false
        DisableWatermark: true
    FirstInstance:
      InstanceName: UNIQUE
      DefaultLanguage: en
      DomainPolicy:
        UserLoginMustBeDomain: false
        ValidateOrgDomain: false
      LoginPolicy:
        AllowDomainDiscovery: true
        AllowRegister: false
replicaCount: 2
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 1Gi
initJob:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi
