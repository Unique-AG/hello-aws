# rabbitmq_prometheus serves :15692/metrics; the operator always enables it.
# Why it is scraped: docs/observability-baseline.md
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmqcluster-chat
  namespace: unique
  labels:
    app.kubernetes.io/name: rabbitmqcluster-chat
    app.kubernetes.io/part-of: rabbitmq
spec:
  # Prometheus selects every ServiceMonitor here: serviceMonitorSelector is {}.
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmqcluster-chat
      app.kubernetes.io/component: rabbitmq
  endpoints:
    - port: prometheus
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
