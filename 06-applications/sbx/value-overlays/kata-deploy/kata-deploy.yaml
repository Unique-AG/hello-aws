# kata-deploy places containerd-shim-kata-v2 on the sandbox nodes and registers
# the runtime handler Conduct's RuntimeClass points at.
#
# Only the `remote` shim: peer-pods needs one binary (shim-v2-go), and nested
# virtualisation is unavailable below a metal instance anyway.
shims:
  disableAll: true
  remote:
    enabled: true

# The chart's default is the qemu shim, which disableAll has just removed; it
# refuses to start unless the default is one of the enabled shims.
defaultShim:
  amd64: remote

# Confined to the sandbox pool: it host-mounts /etc/containerd and /opt/kata
# and restarts the CRI runtime.
nodeSelector:
  workload: sandbox

tolerations:
  - key: workload
    value: sandbox
    effect: NoSchedule

# daemonset, not job: job mode's dispatcher runs only on install and upgrade,
# so autoscaled nodes would come up without the shim.
deploymentMode: daemonset

# Detects TEE hardware; the guest runs in a separate instance, so it is moot.
node-feature-discovery:
  enabled: false

# Through the ECR pull-through cache: the S3 gateway endpoint policy admits
# ECR's layer bucket, not quay.io's own S3 blob store.
image:
  reference: 217381566492.dkr.ecr.us-east-1.amazonaws.com/quay.io/kata-containers/kata-deploy
kubectlImage:
  reference: 217381566492.dkr.ecr.us-east-1.amazonaws.com/quay.io/kata-containers/kubectl
# Unused in daemonset mode; set so switching deploymentMode cannot reintroduce
# a direct quay.io pull.
job:
  dispatcherImage:
    reference: 217381566492.dkr.ecr.us-east-1.amazonaws.com/quay.io/kata-containers/kata-deploy-job-dispatcher
