# Karpenter's node pools and node class (CA 9.2, AWS-CST-01).
#
# Graviton is the default pool and carries no taint. x86 is a second pool,
# tainted, so only a workload whose image has no arm64 build lands there and
# the exception list stays short and visible.
resources:
  - apiVersion: karpenter.k8s.aws/v1
    kind: EC2NodeClass
    metadata:
      name: default
    spec:
      # Karpenter builds the instance profile from this role; 05-compute owns
      # the role and its EC2_LINUX access entry.
      role: uq-dogfood-sbx-use1-karpenter-node
      amiSelectorTerms:
        - alias: al2023@latest
      # The tag the subnets already carry. Adding a second one would change
      # the subnets, and an NLB target-group attachment re-reads its ENI
      # whenever they do, which deregisters the ingress targets.
      subnetSelectorTerms:
        - tags:
            kubernetes.io/cluster/uq-dogfood-sbx-use1: shared
            Type: private
      # Two groups: the nodes' own, and the workload identity group that lets a
      # rule in the network or data layer name a node as a client.
      securityGroupSelectorTerms:
        - tags:
            karpenter.sh/discovery: uq-dogfood-sbx-use1
      metadataOptions:
        # One hop, as the managed node groups use: IMDS stays reachable from
        # the host and not from a pod's network namespace.
        httpPutResponseHopLimit: 1
        httpTokens: required
      blockDeviceMappings:
        - deviceName: /dev/xvda
          ebs:
            volumeSize: 100Gi
            volumeType: gp3
            encrypted: true
            kmsKeyID: arn:aws:kms:us-east-1:217381566492:key/13428ba6-4203-405a-b69a-edb2124b6c21
            deleteOnTermination: true

  - apiVersion: karpenter.sh/v1
    kind: NodePool
    metadata:
      name: general-arm64
    spec:
      # Above general-amd64, so a pod that fits either lands on Graviton.
      # An omitted weight is 0, which would have let amd64's 1 win.
      weight: 50
      template:
        metadata:
          labels:
            scalability: steady
            lifecycle: persistent
        spec:
          nodeClassRef:
            group: karpenter.k8s.aws
            kind: EC2NodeClass
            name: default
          requirements:
            - key: kubernetes.io/arch
              operator: In
              values: ["arm64"]
            - key: kubernetes.io/os
              operator: In
              values: ["linux"]
            - key: karpenter.sh/capacity-type
              operator: In
              values: ["on-demand"]
            - key: karpenter.k8s.aws/instance-category
              operator: In
              values: ["c", "m", "r"]
            - key: karpenter.k8s.aws/instance-generation
              operator: Gt
              values: ["6"]
          # Rotated rather than patched in place; the AMI alias resolves to a
          # newer image and drift replaces the node.
          expireAfter: 336h
      limits:
        cpu: "96"
        memory: 384Gi
      disruption:
        consolidationPolicy: WhenEmptyOrUnderutilized
        consolidateAfter: 1m
        budgets:
          - nodes: "10%"

  - apiVersion: karpenter.sh/v1
    kind: NodePool
    metadata:
      name: data
    spec:
      # Above the general pools, so a store that tolerates the taint lands
      # here rather than on a general node.
      weight: 100
      template:
        metadata:
          labels:
            scalability: steady
            lifecycle: persistent
            workload: data
        spec:
          nodeClassRef:
            group: karpenter.k8s.aws
            kind: EC2NodeClass
            name: default
          # Only the in-cluster stores, so a general workload cannot take
          # capacity a store will need to come back onto.
          taints:
            - key: workload
              value: data
              effect: NoSchedule
          requirements:
            - key: kubernetes.io/arch
              operator: In
              values: ["arm64"]
            - key: kubernetes.io/os
              operator: In
              values: ["linux"]
            - key: karpenter.sh/capacity-type
              operator: In
              values: ["on-demand"]
            # Memory-leaning: Qdrant, Elasticsearch and RabbitMQ are held back
            # by memory before CPU.
            - key: karpenter.k8s.aws/instance-category
              operator: In
              values: ["r", "m"]
            - key: karpenter.k8s.aws/instance-generation
              operator: Gt
              values: ["6"]
          expireAfter: 336h
      limits:
        cpu: "48"
        memory: 384Gi
      disruption:
        consolidationPolicy: WhenEmptyOrUnderutilized
        consolidateAfter: 5m
        budgets:
          - nodes: "1"

  - apiVersion: karpenter.sh/v1
    kind: NodePool
    metadata:
      name: general-amd64
    spec:
      # Lower weight: the scheduler prefers arm64 when a pod fits either.
      weight: 1
      template:
        metadata:
          labels:
            scalability: steady
            lifecycle: persistent
        spec:
          nodeClassRef:
            group: karpenter.k8s.aws
            kind: EC2NodeClass
            name: default
          # A pod reaches this pool only by tolerating the taint, so an image
          # with no arm64 build is a deliberate, visible exception.
          taints:
            - key: kubernetes.io/arch
              value: amd64
              effect: NoSchedule
          requirements:
            - key: kubernetes.io/arch
              operator: In
              values: ["amd64"]
            - key: kubernetes.io/os
              operator: In
              values: ["linux"]
            - key: karpenter.sh/capacity-type
              operator: In
              values: ["on-demand"]
            - key: karpenter.k8s.aws/instance-category
              operator: In
              values: ["c", "m", "r"]
            - key: karpenter.k8s.aws/instance-generation
              operator: Gt
              values: ["6"]
          expireAfter: 336h
      limits:
        cpu: "48"
        memory: 192Gi
      disruption:
        consolidationPolicy: WhenEmptyOrUnderutilized
        consolidateAfter: 1m
        budgets:
          - nodes: "10%"
