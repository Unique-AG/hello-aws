# Karpenter controller. Its AWS identity comes from the Pod Identity
# association in 05-compute, so no IRSA annotation here.
settings:
  clusterName: eks-uq-dogfood-sbx-use1
  # Drains a node on a Spot interruption or scheduled change instead of
  # losing it; the queue and its EventBridge rules are in 05-compute.
  interruptionQueue: uq-dogfood-sbx-use1-karpenter-interruption

serviceAccount:
  create: true
  name: karpenter

# Karpenter cannot provision the node it runs on, so it stays on the managed
# node group that exists before it does.
nodeSelector:
  scalability: steady
  lifecycle: persistent

replicas: 2

controller:
  # Pod Identity injects credentials but no region, and the nodes run an
  # IMDS hop limit of 1, so the SDK's fallback cannot reach it.
  env:
    - name: AWS_REGION
      value: us-east-1
  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      memory: 1Gi

# priorityClassName is deliberately not set: the chart defaults to
# system-cluster-critical, which outranks unique-platform. Nothing scales if
# Karpenter cannot schedule.

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: karpenter
        app.kubernetes.io/name: karpenter
