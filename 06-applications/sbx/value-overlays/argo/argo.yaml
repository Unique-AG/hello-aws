# ArgoCD configuration (AWS sbx)
# Admin account enabled for initial access (OIDC added in follow-up)
nameOverride: argo
global:
  domain: <DOMAIN_BASE>
repoServer:
  extraArgs:
    - --repo-cache-expiration=15m
server:
  ingress:
    enabled: false
configs:
  params:
    server.basehref: /argo
    server.rootpath: /argo
    server.insecure: true
  cm:
    create: true
    url: https://<DOMAIN_BASE>/argo
    admin.enabled: true
    timeout.reconciliation: 30s
  rbac:
    create: true
    # no-access, as both fleet policies use: with SSO on, a default of
    # role:admin makes every authenticated tenant user an Argo CD admin.
    policy.default: role:no-access
    scopes: '[roles]'
    policy.csv: |
        #################################################
        # Policy rules are in the form:
        #   p, subject, resource, action, object, effect
        # Role definitions and bindings are in the form:
        #   g, subject, inherited-subject
        #################################################

        ################### GROUPS #####################
        # The fleet registration module's fixed app roles, mapped as
        # gitops-resources/defaults/global/argocd/policies/permissive does.
        g, maintain, role:admin
        g, infrastructure_support, role:admin
        g, system_support, role:admin
        g, application_support, role:admin
        ################### POLICIES #####################
        # role:sync-only
        p, role:sync-only, applications, get, *, allow
        p, role:sync-only, applications, sync, *, allow
        p, role:sync-only, applications, action/apps/*/restart, *, allow
        p, role:sync-only, applications, action/batch/CronJob/create-job, *, allow
        p, role:sync-only, logs, get, chat/*, deny

        # role:no-access
        p, role:no-access, *, *, *, deny

        # maintainers are kings here and only here
        # role:admin
        p, role:admin, *, *, *, allow
extraObjects: []
