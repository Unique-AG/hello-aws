# ArgoCD configuration (AWS sbx)
# Admin account enabled for initial access (OIDC added in follow-up)
nameOverride: argo
global:
  domain: hello.aws.unique.dev
  # Through the ECR pull-through cache: the S3 gateway endpoint policy admits
  # ECR's layer bucket, not the upstream registries' own S3 blob stores.
  image:
    repository: 217381566492.dkr.ecr.us-east-1.amazonaws.com/quay.io/argoproj/argocd
redis:
  image:
    repository: 217381566492.dkr.ecr.us-east-1.amazonaws.com/public.ecr.aws/docker/library/redis
repoServer:
  extraArgs:
    - --repo-cache-expiration=15m
server:
  ingress:
    enabled: false
configs:
  params:
    server.basehref: /argo
    server.rootpath: /argo
    server.insecure: true
  cm:
    create: true
    url: https://hello.aws.unique.dev/argo
    admin.enabled: true
    timeout.reconciliation: 30s
  rbac:
    create: true
    policy.default: role:admin
    scopes: '[roles]'
    policy.csv: |
        #################################################
        # Policy rules are in the form:
        #   p, subject, resource, action, object, effect
        # Role definitions and bindings are in the form:
        #   g, subject, inherited-subject
        #################################################

        ################### GROUPS #####################
        g, maintain, role:admin
        ################### POLICIES #####################
        # role:sync-only
        p, role:sync-only, applications, get, *, allow
        p, role:sync-only, applications, sync, *, allow
        p, role:sync-only, applications, action/apps/*/restart, *, allow
        p, role:sync-only, applications, action/batch/CronJob/create-job, *, allow
        p, role:sync-only, logs, get, chat/*, deny

        # role:no-access
        p, role:no-access, *, *, *, deny

        # maintainers are kings here and only here
        # role:admin
        p, role:admin, *, *, *, allow
extraObjects: []
