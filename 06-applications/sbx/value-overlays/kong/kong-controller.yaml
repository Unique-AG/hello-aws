# Mirrored controller, Docker Official gateway. The controller's own image is
# under ingressController: controller and gateway both alias the kong chart.
controller:
  ingressController:
    image:
      repository: 217381566492.dkr.ecr.us-east-1.amazonaws.com/mirror/kong/kubernetes-ingress-controller
      tag: 3.4.4@sha256:cf74e0e1e54a5a96d7b48e1c02120369953d66126ff5763398372bce925b5d8e
    envFrom:
      - configMapRef:
          name: kong-controller-environment
  proxy:
    type: ClusterIP
  # nodeSelector removed for sbx - nodes don't have these labels
  # nodeSelector:
  #   scalability: steady
  #   lifecycle: persistent
  deploymentAnnotations:
    configmap.reloader.stakater.com/reload: "kong-controller-environment"
  extraObjects:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kong-controller-environment
      data:
        CONTROLLER_LOG_LEVEL: info
        CONTROLLER_PROXY_SYNC_SECONDS: "15"
    - apiVersion: gateway.networking.k8s.io/v1
      kind: GatewayClass
      metadata:
        name: kong
        annotations:
          konghq.com/gatewayclass-unmanaged: "true"
      spec:
        controllerName: konghq.com/kic-gateway-controller
gateway:
  image:
    repository: 217381566492.dkr.ecr.us-east-1.amazonaws.com/public.ecr.aws/docker/library/kong
    tag: 3.9.0@sha256:b2980ac91056bcc9cbf593b2b3d6a8c458cc134304b4d83bc4c93a6449f18df7
  # nodeSelector removed for sbx - nodes don't have these labels
  # nodeSelector:
  #   scalability: steady
  #   lifecycle: persistent
  proxy:
    type: ClusterIP
    tls:
      appProtocol: "https"
  plugins:
    configMaps:
      - name: kong-plugin-unique-jwt-auth
        pluginName: unique-jwt-auth
      - name: kong-plugin-unique-app-repo-auth
        pluginName: unique-app-repo-auth
  deploymentAnnotations:
    configmap.reloader.stakater.com/reload: "kong-gateway-environment,kong-plugin-unique-jwt-auth,kong-plugin-unique-app-repo-auth"
  envFrom:
    - configMapRef:
        name: kong-gateway-environment
  status:
    tls:
      enabled: true
  certificates:
    enabled: true
    clusterIssuer: internal-ca-issuer
    proxy:
      enabled: true
      clusterIssuer: internal-ca-issuer
      commonName: hello.aws.unique.dev
      dnsNames:
        - hello.aws.unique.dev
        - api.hello.aws.unique.dev
        - id.hello.aws.unique.dev
    admin:
      enabled: false
    cluster:
      enabled: false
    portal:
      enabled: false
  extraObjects:
    - apiVersion: elbv2.k8s.aws/v1beta1
      kind: TargetGroupBinding
      metadata:
        name: kong-proxy-http
      spec:
        serviceRef:
          name: kong-gateway-proxy
          port: 80
        targetGroupARN: arn:aws:elasticloadbalancing:us-east-1:217381566492:targetgroup/uq-dogfood-x-use1-ing-http/6c196a801484bb2f
        targetType: ip
    - apiVersion: elbv2.k8s.aws/v1beta1
      kind: TargetGroupBinding
      metadata:
        name: kong-proxy-https
      spec:
        serviceRef:
          name: kong-gateway-proxy
          port: 443
        targetGroupARN: arn:aws:elasticloadbalancing:us-east-1:217381566492:targetgroup/uq-dogfood-x-use1-ing-https/764a80968a0ef4a7
        targetType: ip
