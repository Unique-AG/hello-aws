# Every secret the platform needs a value for, and where that value comes from.
#
# This file is the inventory. It holds no secret material: external values are
# fetched at run time from the store named in <env>/secrets-sources.yaml, which
# is not committed.
#
# kind:
#   generate  this script creates a random value
#   derive    this script computes it from Terraform outputs
#   external  an operator credential store supplies it
#   managed   another step owns it; this script only reports on it
#
# ref:  key in the compute/data layer's secret_arns output
# id:   literal Secrets Manager name, for secrets no output exposes

secrets:
  # --- generated ------------------------------------------------------------
  - { name: encryption-key-app-repository, ref: encryption_key_app_repository, kind: generate, generator: password }
  - { name: encryption-key-node-chat-lxm,  ref: encryption_key_node_chat_lxm,  kind: generate, generator: hex }
  - { name: encryption-key-ingestion,      ref: encryption_key_ingestion,      kind: generate, generator: hex }
  - { name: zitadel-db-user-password,      ref: zitadel_db_user_password,      kind: generate, generator: password }
  - { name: zitadel-master-key,            ref: zitadel_master_key,            kind: generate, generator: password }
  - { name: zitadel-firstinstance-password, ref: zitadel_firstinstance_password, kind: generate, generator: password }
  - { name: rabbitmq-password-chat,        ref: rabbitmq_password_chat,        kind: generate, generator: password }
  - { name: litellm-proxy-master-key,      ref: litellm_proxy_master_key,      kind: generate, generator: password }
  - { name: litellm-salt-key,              ref: litellm_salt_key,              kind: generate, generator: password }
  - { name: grafana-admin-password,        id:  grafana-admin-password,        kind: generate, generator: password }

  # --- derived from Terraform ----------------------------------------------
  # One per database in the postgresql_databases output; the password comes from
  # the Aurora master secret, URL-encoded.
  - { name: psql-connection-strings,       kind: derive, deriver: psql_connection_strings }
  # Needs the litellm master key, so it is written after the generated ones.
  - { name: azure-openai-endpoint-definitions, ref: azure_openai_endpoint_definitions, kind: derive, deriver: litellm_endpoints }
  # Rotating replaces the IAM access key, so the old one stops working.
  - { name: s3-access-key,                 kind: derive, deriver: s3_access_key }

  # --- supplied by the operator --------------------------------------------
  - { name: acr-credentials,               id: ecr-pullthroughcache/uniquecr.azurecr.io, kind: external, source: acr }
  - { name: argocd-github-app,             ref: argocd_github_app,             kind: external, source: argocd_github_app }
  - { name: alertmanager-slack-webhook-url, id: alertmanager-slack-webhook-url, kind: external, source: alertmanager_slack_webhook, optional: true }
  - { name: google-search-api-key,         ref: google_search_api_key,         kind: external, source: google_search, optional: true }
  - { name: litellm-azure-foundry-api-key, id: litellm-azure-foundry-api-key,  kind: external, source: azure_foundry_api_key, optional: true }
  - { name: litellm-azure-foundry-endpoint, id: litellm-azure-foundry-endpoint, kind: external, source: azure_foundry_endpoint, optional: true }

  # --- owned elsewhere ------------------------------------------------------
  # scripts/setup-zitadel.sh creates the service user and writes the real PAT.
  - { name: manual-zitadel-scope-mgmt-pat, ref: zitadel_pat, kind: managed, owner: "scripts/setup-zitadel.sh" }
