env:
  GUNICORN_THREADS: 4
  GUNICORN_WORKERS: 2
  AZURE_DOCUMENT_INTELLIGENCE_LOCATION: switzerlandnorth
  AZURE_DOCUMENT_INTELLIGENCE_API_VERSION: 2023-07-31
  ENABLED_MIME_TYPES_DOCUMENT_TRANSLATION: '["DOCX", "MSEXCEL", "EXCEL", "PPT", "MSPPT"]'
  API_BASE: http://backend-service-chat.unique.svc/public
  QUARTR_API_CREDS: "unset_value" # will need to be loaded using .secretProvider and put there via GHA (pre-encrypted locally)
  CRAWL4_AI_BASE_DIRECTORY: '/tmp'
nodeSelector:
  scalability: steady
  lifecycle: persistent
probes:
  enabled: true
  liveness:
    httpGet:
      path: /bundle
  readiness:
    httpGet:
      path: /bundle
  startup:
    httpGet:
      path: /bundle
replicaCount: 2
resources:
  limits:
    cpu: 500m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 2Gi
securityContext:
  readOnlyRootFilesystem: false
serviceAccount:
  enabled: true
  workloadIdentity:
    enabled: true
volumes:
  - name: tmp-volume
    emptyDir:
      sizeLimit: 500Mi
volumeMounts:
  - mountPath: /tmp
    name: tmp-volume

# backend-service listens on 8080/80 by default; this service is addressed on 8081.
ports:
  application: 8081
service:
  port: 8081
# ai-service supplied both as chart defaults; backend-service leaves them unset.
lifecycle:
  preStop:
    httpGet:
      path: can_shutdown
      port: 8081
terminationGracePeriodSeconds: 3600
# ai-service published no route. Callers reach this service in-cluster.
routes:
  paths:
    default:
      enabled: false
    versioned:
      enabled: false
    scoped:
      enabled: false
    probe:
      enabled: false
