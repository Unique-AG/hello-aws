# Always-on watchdog: critical-path browser + API checks against the deployment.
# Self-contained — tests live in ./e2e in this repo.
# A fork sets AWS_ROLE_ARN and creates its own credentials secret (see e2e/README.md).
name: "e2e · AWS Watchdog"

permissions:
  contents: read
  id-token: write

# Shared across watchdog + smoke: one test user on one tenant must never run
# two suites at once (they'd race the same session/spaces).
concurrency:
  group: e2e-aws-suite
  cancel-in-progress: false

on:
  workflow_dispatch:
  # Schedule paused: the sbx compute and data layers were destroyed, so every
  # run fails against an environment that no longer exists. Restore on redeploy.
  # schedule:
  #   - cron: "*/5 5-21 * * *"   # every 5 min, 05:00–21:59 UTC (07:00–23:59 CEST / 06:00–22:59 CET)
  #   - cron: "0 22,23,0-4 * * *" # hourly overnight (UTC)

jobs:
  watchdog:
    name: 🐕‍🦺 AWS Watchdog (browser + API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    env:
      CI: "true"
      TEST_ENV: AWS
      AWS_REGION: eu-central-2
      E2E_SECRET_ID: manual-e2e-aws-credentials
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Load credentials from Secrets Manager
        # Runs after the installs so third-party postinstall code never inherits
        # the role, and drops the role as soon as the secret has been read.
        run: |
          set -euo pipefail
          secret="$(aws secretsmanager get-secret-value \
            --secret-id "$E2E_SECRET_ID" --query SecretString --output text)"
          while IFS= read -r k; do
            v="$(printf '%s' "$secret" | jq -r --arg k "$k" '.[$k]')"
            printf '::add-mask::%s\n' "$v"
            printf '%s=%s\n' "$k" "$v" >> "$GITHUB_ENV"
          done < <(printf '%s' "$secret" | jq -r 'keys[]')
          for n in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            printf '%s=\n' "$n" >> "$GITHUB_ENV"
          done
      - run: npm run test:watchdog
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: e2e-report-watchdog
          path: e2e/playwright-report/
          retention-days: 30
      - name: Alert on failure (optional)
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            text: "🐕‍🦺 AWS watchdog failed (${{ github.repository }}) — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
