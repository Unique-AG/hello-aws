name: '[img] Mirror third-party artifacts'

# Copies the artifacts listed in 06-applications/mirror-artifacts.yaml into this
# account's ECR. They have no copy on a registry the cluster can already reach,
# and their upstream serves layers from in-region S3, which the S3 gateway
# endpoint policy refuses. Everything else should use the pull-through cache.
#
# Manual: the list changes rarely, and a copy is only needed before the version
# that references it is deployed.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Mirror one target repository (blank = every entry)'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-2' }}
  CRANE_VERSION: v0.22.1
  CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
  YQ_VERSION: v4.54.1
  YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f

concurrency:
  group: mirror-artifacts
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # crane copies registry-to-registry, so multi-arch manifest lists survive.
      # docker pull would flatten them to the runner's own platform.
      - name: Install crane and yq
        run: |
          set -euo pipefail
          URL="https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          curl -sSL "$URL" -o crane.tar.gz
          echo "${CRANE_SHA256}  crane.tar.gz" | sha256sum -c -
          tar -xzf crane.tar.gz crane
          sudo install -m 0755 crane /usr/local/bin/crane
          crane version

          # Pinned rather than relying on whatever the runner image ships.
          curl -sSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o yq
          echo "${YQ_SHA256}  yq" | sha256sum -c -
          sudo install -m 0755 yq /usr/local/bin/yq
          yq --version

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Copy each artifact
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          MANIFEST=06-applications/mirror-artifacts.yaml
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          aws ecr get-login-password --region "$AWS_REGION" \
            | crane auth login "$REGISTRY" --username AWS --password-stdin

          COUNT=$(yq -r '.artifacts | length' "$MANIFEST")
          [ "$COUNT" -gt 0 ] || { echo "::error::No artifacts listed in ${MANIFEST}"; exit 1; }

          COPIED=0
          for i in $(seq 0 $((COUNT - 1))); do
            SRC=$(yq -r ".artifacts[$i].source" "$MANIFEST")
            DIG=$(yq -r ".artifacts[$i].digest" "$MANIFEST")
            TGT=$(yq -r ".artifacts[$i].target" "$MANIFEST")
            REPO="${TGT%:*}"

            if [ -n "$ONLY" ] && [ "$ONLY" != "$REPO" ] && [ "$ONLY" != "$TGT" ]; then
              continue
            fi

            # Copy by digest, not tag: the tag only records what the chart asks
            # for, and an upstream retag must not change what we mirror.
            FROM="index.docker.io/${SRC%:*}@${DIG}"
            echo "--- ${FROM}"
            echo "    -> ${REGISTRY}/${TGT}"

            aws ecr describe-repositories --repository-names "$REPO" --region "$AWS_REGION" >/dev/null 2>&1 \
              || aws ecr create-repository --repository-name "$REPO" --region "$AWS_REGION" \
                   --image-tag-mutability IMMUTABLE >/dev/null

            crane copy "$FROM" "${REGISTRY}/${TGT}"

            # The copy preserves the manifest digest; prove it rather than trust it.
            GOT=$(crane digest "${REGISTRY}/${TGT}")
            if [ "$GOT" != "$DIG" ]; then
              echo "::error::${TGT} landed as ${GOT}, expected ${DIG}"
              exit 1
            fi
            echo "    digest verified ${GOT}"
            COPIED=$((COPIED + 1))
          done

          if [ "$COPIED" -eq 0 ]; then
            echo "::error::Nothing matched ONLY='${ONLY}'"
            exit 1
          fi
          echo "Mirrored ${COPIED} artifact(s)."
