name: '[img] Pod VM image'

# Builds the Conduct pod VM disk image from source and registers it as an AMI.
#
# Manual only. It takes tens of minutes, writes a multi-gigabyte image through
# S3 and leaves a registered AMI behind, none of which should happen because
# someone pushed.
#
# Run it from the deployment branch: the import reads Terraform outputs, so it
# needs that branch's backend configuration.
on:
  workflow_dispatch:
    inputs:
      caa_ref:
        description: 'cloud-api-adaptor ref to build (blank = the pinned one, which is what the chart expects)'
        required: false
        default: ''
      skip_scan:
        description: 'Skip the image scan (trivy cannot read this image''s squashfs root)'
        type: boolean
        required: false
        default: true

permissions:
  id-token: write
  contents: read
  attestations: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-2' }}

concurrency:
  group: podvm-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Everything that can be checked cheaply is checked before the build,
      # because the build is the expensive part and the import is what fails.
      - name: Preflight
        run: |
          set -euo pipefail
          ./05-compute/scripts/build-podvm-image.sh --check

          terraform -chdir=05-compute/terraform init -input=false \
            -backend-config=environments/sbx/backend-config.hcl >/dev/null
          terraform -chdir=03-infrastructure/terraform init -input=false \
            -backend-config=environments/sbx/backend-config.hcl >/dev/null

          BUCKET=$(terraform -chdir=05-compute/terraform output -raw podvm_import_bucket 2>/dev/null || true)
          if [ -z "$BUCKET" ]; then
            echo "::error::The staging bucket does not exist, so the import would fail after the build."
            echo "Apply the compute layer once with enable_podvm_image_import=true, then run this again."
            exit 1
          fi
          echo "Staging bucket: ${BUCKET}"

      # The runner ships with about 14 GB free, and the build needs more than
      # that for the builder images and the raw disk together.
      - name: Make room for the build
        run: |
          df -h / | awk 'NR==2{print "before: "$4" free"}'
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | awk 'NR==2{print "after:  "$4" free"}'

      - name: Build the image
        run: |
          set -euo pipefail
          ./05-compute/scripts/build-podvm-image.sh \
            ${{ inputs.caa_ref && format('--ref {0}', inputs.caa_ref) || '' }} \
            --out "${RUNNER_TEMP}/podvm-build"
          ls -la "${RUNNER_TEMP}/podvm-build"/*.raw "${RUNNER_TEMP}/podvm-build"/*.provenance

      # Attests the artifact this workflow actually produced. The build already
      # verifies upstream's binary attestations; this covers the image itself,
      # which upstream does not publish one for.
      - name: Attest the image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/podvm-build/*.raw

      - name: Import as an AMI
        run: |
          set -euo pipefail
          RAW=$(ls "${RUNNER_TEMP}"/podvm-build/*.raw)
          ./05-compute/scripts/import-podvm-ami.sh \
            --image "$RAW" \
            ${{ inputs.skip_scan && '--skip-scan' || '' }}

      # The image is far too large to keep; the record of what was built is not.
      - name: Keep the provenance record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: podvm-provenance
          path: ${{ runner.temp }}/podvm-build/*.provenance
          if-no-files-found: warn
