name: '[rel] Release'
# Publishes a GitHub Release for a release tag (YYYY.WW.P) on main, from a
# pushed tag or from workflow_dispatch. See docs/release-concept.md.
on:
  push:
    tags: ['20[0-9][0-9].[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (YYYY.WW.P) — tags the tip of main'
        required: true
        type: string

permissions:
  contents: write
  # Reading the smoke run's validation evidence.
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history + tags: previous-tag lookup and the main-ancestry check.
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Resolve version and target commit
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG_EXISTS=false
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
            # A tag this workflow pushed does not start a new run, so a failure
            # after tagging can only be retried here. On a retry the tag is the
            # target, not the tip of main -- main has usually moved on by then.
            # The ancestry check below still requires it to be on main.
            if TARGET=$(git rev-parse -q --verify "refs/tags/${VERSION}^{commit}"); then
              echo "Tag ${VERSION} already exists at ${TARGET}; re-publishing for it."
              TAG_EXISTS=true
            else
              TARGET=$(git rev-parse origin/main)
            fi
          else
            VERSION="$GITHUB_REF_NAME"
            TARGET=$(git rev-parse "refs/tags/${VERSION}^{commit}")
          fi
          if [[ ! "$VERSION" =~ ^20[0-9]{2}\.[0-9]{1,2}\.[0-9]+(-aws\.[0-9]+)?$ ]]; then
            echo "::error::'${VERSION}' is not a release version (YYYY.WW.P[-aws.N])."
            exit 1
          fi
          # An -aws.N revision deploys the same Unique release, so the app specs
          # pin the base version, not the tag.
          BASE="${VERSION%%-aws.*}"
          if ! git merge-base --is-ancestor "$TARGET" origin/main; then
            echo "::error::${TARGET} is not on main; releases are cut from main only."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BASE=${BASE}" >> "$GITHUB_ENV"
          echo "TARGET=${TARGET}" >> "$GITHUB_ENV"
          echo "TAG_EXISTS=${TAG_EXISTS}" >> "$GITHUB_ENV"

      - name: Check the release content pins this version
        # Every Unique image tag and release-locked chart in the app specs must
        # equal the release version, so a tag cannot be cut on unbumped content.
        run: |
          set -euo pipefail
          git checkout --quiet "$TARGET"
          # shellcheck disable=SC2016 # $v is a yq variable
          # Collected first: with the || true on the whole pipeline, a find or
          # yq failure produced an empty list and the gate passed.
          pins=$(find 06-applications/*/apps -name '*.yaml' -print0 \
            | xargs -0 yq -N -r '
                (((.spec.sources // []) + [.spec.source]) | .[] | select(. != null)
                  | .helm.valuesObject.image.tag // "", .targetRevision // "")
                | tostring | select(test("^20[0-9]{2}\\.[0-9]+\\.[0-9]+$"))
                | filename + ": " + .')
          if [[ -z "$pins" ]]; then
            echo "::error::Found no pinned versions in 06-applications/*/apps; the check cannot confirm anything."
            exit 1
          fi
          # grep exits 1 when nothing mismatches, which is the success case.
          mismatches=$(printf '%s\n' "$pins" | grep -v ": ${BASE}\$" || true)
          if [[ -n "$mismatches" ]]; then
            echo "::error::App specs do not pin ${BASE}:"
            echo "$mismatches"
            exit 1
          fi

      - name: Check the release was validated
        # A release is published only after it has run. The evidence is the smoke
        # suite's own output at this commit, against the cluster as it stands now.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow=e2e-smoke.yaml --commit "$TARGET" --limit 20 \
            --json databaseId,conclusion,createdAt \
            --jq '[.[] | select(.conclusion == "success")]
                  | sort_by(.createdAt) | last | .databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful e2e-smoke run at ${TARGET}; validate the commit first."
            exit 1
          fi
          work=$(mktemp -d)
          if ! gh run download "$run_id" -n e2e-validation -D "$work" 2>/dev/null; then
            echo "::error::e2e-smoke run ${run_id} published no validation evidence."
            exit 1
          fi
          deploy_now=$(git ls-remote origin refs/heads/deploy/sbx | cut -f1)
          # expected > 0 so an empty suite cannot satisfy the zero-failure checks.
          if ! jq -e --arg target "$TARGET" --arg deploy "$deploy_now" '
                 .target == $target
                 and .deploy_start == .deploy_end
                 and .deploy_end == $deploy
                 and .stats.expected > 0
                 and .stats.unexpected == 0
                 and .stats.flaky == 0
                 and .stats.skipped == 0
               ' "${work}/validation.json" >/dev/null; then
            echo "::error::Evidence from e2e-smoke run ${run_id} does not clear the gate."
            jq . "${work}/validation.json"
            echo "deploy/sbx is now ${deploy_now}"
            exit 1
          fi
          # The evidence proves the suite passed against deploy/sbx as it stands.
          # It does not prove that revision carries this release: the deploy branch
          # advances by cherry-pick, so the release commit is never its ancestor
          # and the SHAs cannot be compared. Compare what they pin instead.
          tree=$(mktemp -d)
          git archive "$deploy_now" 06-applications 2>/dev/null | tar -x -C "$tree" || {
            echo "::error::Could not read 06-applications at deploy/sbx ${deploy_now}."
            exit 1
          }
          # shellcheck disable=SC2016 # $v is a yq variable
          deploy_pins=$(find "$tree"/06-applications/*/apps -name '*.yaml' -print0 \
            | xargs -0 yq -N -r '
                (((.spec.sources // []) + [.spec.source]) | .[] | select(. != null)
                  | .helm.valuesObject.image.tag // "", .targetRevision // "")
                | tostring | select(test("^20[0-9]{2}\\.[0-9]+\\.[0-9]+$"))
                | filename + ": " + .')
          if [[ -z "$deploy_pins" ]]; then
            echo "::error::Found no pinned versions at deploy/sbx; the check cannot confirm anything."
            exit 1
          fi
          stale=$(printf '%s\n' "$deploy_pins" | grep -v ": ${BASE}\$" || true)
          if [[ -n "$stale" ]]; then
            echo "::error::deploy/sbx does not pin ${BASE}, so the validated cluster is not running this release:"
            printf '%s\n' "$stale" | sed "s|${tree}/||"
            exit 1
          fi

          echo "Validated by e2e-smoke run ${run_id} against deploy/sbx ${deploy_now}:"
          jq -c '.stats' "${work}/validation.json"

      - name: Create the tag
        if: github.event_name == 'workflow_dispatch' && env.TAG_EXISTS != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release ${VERSION}" "$TARGET"
          git push origin "refs/tags/${VERSION}"

      - name: Render release notes
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 --match '20[0-9][0-9].*' "${VERSION}^" 2>/dev/null || true)
          echo "PREV=${PREV}" >> "$GITHUB_ENV"
          ./scripts/release-notes.sh "$PREV" "$VERSION" > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The merged-PR changelog is generated explicitly (not --generate-notes) so a
          # re-run that edits an existing release rebuilds the same full body.
          gen=(-f tag_name="$VERSION" -f target_commitish="$TARGET")
          [[ -n "$PREV" ]] && gen+=(-f previous_tag_name="$PREV")
          { echo; gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${gen[@]}" -q .body; } \
            >> "${RUNNER_TEMP}/notes.md"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "Release ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md"
          else
            gh release create "$VERSION" --title "Release ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md" --verify-tag
          fi
