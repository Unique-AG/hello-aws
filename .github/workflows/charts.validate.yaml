name: '[charts] Validate'
on:
  pull_request:
    paths:
      - '06-applications/charts/**'
      - '06-applications/sbx/value-overlays/conduct/**'
      - '06-applications/scripts/test-charts.sh'
      - '.github/workflows/charts.validate.yaml'

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  # The cluster these charts are rendered for.
  KUBERNETES_VERSION: 1.35.0

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Pinned to the version that produced the golden files: rendered output
      # differs between helm minors, so an unpinned bump fails them spuriously.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.0.4

      # Lints and renders every chart, diffing against the committed output.
      # Also exercises values.schema.json, which helm enforces while templating.
      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Lint and verify rendered output
        working-directory: 06-applications
        run: ./scripts/test-charts.sh

      # Validates the rendered manifests against the target cluster's API
      # schemas. The CRD catalog covers cert-manager's Certificate and Issuer,
      # so no kind is skipped and an unrecognised one fails rather than passing.
      - name: Validate against the Kubernetes API
        working-directory: 06-applications
        run: |
          set -euo pipefail
          kubeconform -kubernetes-version "${KUBERNETES_VERSION}" -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            charts/.golden/*.yaml
