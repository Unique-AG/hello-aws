name: '[tf] [sbx] Drift'

# DAT-13 asks that drift be found rather than waited for. A plan is read-only,
# so this runs against what is deployed and reports instead of correcting.
on:
  schedule:
    # Between the image scan (02:23) and the Zitadel reconcile (06:41), so the
    # three scheduled jobs do not contend for the same runner minutes.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  plan:
    name: "drift · ${{ matrix.layer }}"
    runs-on: ubuntu-latest
    strategy:
      # Every layer is reported, not just the first that drifts.
      fail-fast: false
      matrix:
        layer:
          - 01-bootstrap
          - 02-governance
          - 03-infrastructure
          - 04-data-and-ai
          - 05-compute
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # What is deployed, not what is merged: the environment's var files
          # and backend config exist only on the deploy branch.
          ref: deploy/sbx
          fetch-depth: 0

      - name: Derive semantic_version from git
        # Same derivation as the deploy workflow: module.naming validates it as
        # semver, and a bare SHA has no dots.
        run: |
          VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "0.0.0")
          echo "TF_VAR_semantic_version=${VERSION}" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      - name: Plan
        id: plan
        working-directory: ${{ matrix.layer }}/terraform
        # -lock=false so a drift plan can never hold the state lock against a
        # deploy; -detailed-exitcode makes 2 mean "drifted" rather than "failed".
        run: |
          set -euo pipefail
          terraform init -input=false -backend-config=environments/sbx/backend-config.hcl
          set +e
          terraform plan -input=false -lock=false -no-color -detailed-exitcode \
            -var-file=../../common.auto.tfvars \
            -var-file=environments/sbx/00-config.auto.tfvars > plan.txt 2>&1
          rc=$?
          set -e
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          tail -60 plan.txt
          case "$rc" in
            0) echo "::notice title=${{ matrix.layer }}::no drift" ;;
            2) echo "::error title=${{ matrix.layer }}::drifted — the plan above is what the cluster is missing"; exit 1 ;;
            *) echo "::error title=${{ matrix.layer }}::plan failed"; exit 1 ;;
          esac
