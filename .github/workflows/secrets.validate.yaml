name: '[sec] Validate secret declarations'

# `secrets.yaml` can mark a secret optional while an ExternalSecret reads it as
# if it were required. Nothing reconciled the two, so the mismatch only showed
# up as a pod that never started. This fails the PR instead.
on:
  pull_request:
    paths:
      - '06-applications/secrets.yaml'
      - '06-applications/**/external-secrets.yaml'
      - 'scripts/check-secret-optionality.py'
      - '.github/workflows/secrets.validate.yaml'

permissions:
  contents: read

jobs:
  optionality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Standard library only, so there is nothing to install or pin.
      - name: Check optional secrets are not read as required
        run: python3 scripts/check-secret-optionality.py
