name: '[sec] Secret scan'
on:
  # Unfiltered by path on purpose: a secret can be added to any file.
  pull_request:
  push:
    branches:
      - main
      - 'deploy/**'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history: a PR range needs both endpoints.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.0'
          GITLEAKS_SHA256: '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e'
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # PR: the commits it adds. Push: the branch's first-parent history.
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            LOG_OPTS="${BASE_SHA}..${HEAD_SHA}"
          else
            LOG_OPTS="--first-parent ${GITHUB_SHA}"
          fi

          echo "scanning: ${LOG_OPTS}"

          # Exit 1 = findings, >1 = execution error; both fail the job.
          rc=0
          gitleaks git \
            --no-banner \
            --redact \
            --config scripts/gitleaks-config.toml \
            --baseline-path scripts/gitleaks-baseline.json \
            --log-opts="${LOG_OPTS}" \
            --report-format json \
            --report-path gitleaks-report.json || rc=$?

          if [[ "$rc" -gt 1 ]]; then
            echo "::error::gitleaks failed to run (exit $rc) - nothing was scanned"
            exit 1
          fi

          count=$(jq 'length' gitleaks-report.json 2>/dev/null || echo 0)
          if [[ "$count" -gt 0 ]]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::\(.RuleID): \(.Description)"' gitleaks-report.json
            echo "::error::${count} potential secret(s) detected - see annotations above"
            exit 1
          fi

          echo "no secrets detected"
