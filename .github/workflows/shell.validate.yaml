name: '[shell] Validate'

# Lints every tracked shell script. No other workflow lints any.

on:
  # No paths filter: discovery finds scripts by shebang, so one without a .sh
  # suffix must still start this job.
  pull_request:

permissions:
  contents: read

env:
  # Pinned like every other dependency here: a floating linter changes what
  # passes without a change in this repository.
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install shellcheck
        run: |
          set -euo pipefail
          curl -fsSL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar xJf shellcheck.tar.xz "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Lint every tracked shell script
        run: |
          set -euo pipefail
          # By shebang as well as extension: .githooks/pre-commit and pre-push
          # carry neither, and a new script without .sh must not slip the gate.
          mapfile -t FILES < <(
            {
              git ls-files '*.sh'
              git ls-files | while read -r f; do
                [ -f "$f" ] || continue
                head -n1 -- "$f" 2>/dev/null | grep -qE '^#!.*\b(ba)?sh\b' && printf '%s\n' "$f"
              done
            } | sort -u
          )
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No shell scripts found — the discovery step is broken, not the tree."
            exit 1
          fi
          printf 'Linting %d script(s)\n' "${#FILES[@]}"
          # -x follows a sourced library instead of reporting it as SC1091.
          shellcheck -x "${FILES[@]}"
          echo "All ${#FILES[@]} script(s) clean."
