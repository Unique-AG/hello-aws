# Recovery Region pairing (CA 16.3). Semantics: 03-infrastructure/README.md
# null = no default pair; the Region recovers in-Region unless a customer opts in.

pairs:
  # Reciprocal
  eu-central-1: eu-west-1
  eu-west-1: eu-central-1
  us-east-1: us-west-2
  us-west-2: us-east-1

  # One-way
  eu-west-3: eu-central-1
  eu-north-1: eu-west-1
  us-east-2: us-west-2
  us-west-1: us-east-1

  # Opt-in only
  eu-central-2: null   # Switzerland
  eu-west-2: null      # United Kingdom
  ap-southeast-1: null # Singapore
