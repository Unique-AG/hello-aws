# Recovery Region pairing — CA 16.3 (AWS-RES-09).
#
# Each installation Region recovers into the Region named here, and the control
# plane reads its recovery Region from this same table. The recovery runbook
# describes the procedure; this file is the data it acts on, so the pairing is
# versioned with the blueprint rather than living only in prose.
#
# A pair written in both directions is reciprocal: either Region can recover the
# other. A pair written once is one-way — the named Region receives, and is not
# itself recovered from the Region that names it.
#
# null means no default pair. Switzerland, the United Kingdom and Singapore are
# single-Region by default because moving data across their borders is a customer
# decision, not ours. A customer who opts in sets the Region here; otherwise
# recovery stays in-Region and the runbook says so.

pairs:
  # Reciprocal
  eu-central-1: eu-west-1
  eu-west-1: eu-central-1
  us-east-1: us-west-2
  us-west-2: us-east-1

  # One-way
  eu-west-3: eu-central-1
  eu-north-1: eu-west-1
  us-east-2: us-west-2
  us-west-1: us-east-1

  # Opt-in only — see the note above
  eu-central-2: null   # Switzerland
  eu-west-2: null      # United Kingdom
  ap-southeast-1: null # Singapore
