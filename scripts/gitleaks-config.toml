# Gitleaks Configuration for Hello AWS Repository
# This configuration defines rules for detecting secrets in the codebase

title = "Hello AWS Secret Detection"

[allowlist]
  description = "Only this config file is globally excluded: its body contains the rule patterns and so matches itself."
  paths = [
    '''^scripts/gitleaks-config\.toml$''',
  ]

[[rules]]
  id = "aws-access-key"
  description = "AWS Access Key"
  regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
  tags = ["aws", "key"]

[[rules]]
  id = "aws-secret-key"
  description = "AWS Secret Key"
  regex = '''(?i)aws_secret_access_key[=:][\s"']*([A-Za-z0-9+/]{40})'''
  tags = ["aws", "secret"]

[[rules]]
  id = "aws-session-token"
  description = "AWS Session Token"
  regex = '''(?i)aws_session_token[=:][\s"']*([A-Za-z0-9+/]{260,400})'''
  tags = ["aws", "token"]

[[rules]]
  id = "private-key"
  description = "Private Key"
  regex = '''-----BEGIN [A-Z ]*PRIVATE KEY-----'''
  tags = ["key", "private"]

[[rules]]
  id = "certificate"
  description = "Certificate"
  regex = '''-----BEGIN CERTIFICATE-----'''
  tags = ["certificate"]

[[rules]]
  id = "ssh-private-key"
  description = "SSH Private Key"
  regex = '''-----BEGIN OPENSSH PRIVATE KEY-----'''
  tags = ["ssh", "key", "private"]

[[rules]]
  id = "rsa-private-key"
  description = "RSA Private Key"
  regex = '''-----BEGIN RSA PRIVATE KEY-----'''
  tags = ["rsa", "key", "private"]

[[rules]]
  id = "pgp-private-key"
  description = "PGP Private Key"
  regex = '''-----BEGIN PGP PRIVATE KEY BLOCK-----'''
  tags = ["pgp", "key", "private"]

[[rules]]
  id = "github-token"
  description = "GitHub Personal Access Token"
  regex = '''ghp_[A-Za-z0-9]{36}'''
  tags = ["github", "token"]

[[rules]]
  id = "github-oauth"
  description = "GitHub OAuth Access Token"
  regex = '''gho_[A-Za-z0-9]{36}'''
  tags = ["github", "oauth"]

[[rules]]
  id = "generic-api-key"
  description = "Generic API Key"
  regex = '''(?i)(api[_-]?key|apikey)[=:][\s"']*([A-Za-z0-9_-]{20,})'''
  tags = ["api", "key"]

[[rules]]
  id = "slack-token"
  description = "Slack Token"
  regex = '''xox[baprs]-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24,34}'''
  tags = ["slack", "token"]

[[rules]]
  id = "stripe-key"
  description = "Stripe API Key"
  regex = '''(?i)sk_live_[0-9a-zA-Z]{24}'''
  tags = ["stripe", "key", "secret"]

[[rules]]
  id = "database-password"
  description = "Database Password"
  regex = '''(?i)(database.*password|db.*password|redis.*password)[=:][\s"']*([^;\s]{8,})'''
  tags = ["database", "password"]

[[rules]]
  id = "jwt-token"
  description = "JWT Token"
  regex = '''eyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*'''
  tags = ["jwt", "token"]

[[rules]]
  id = "hardcoded-password"
  description = "Hardcoded Password"
  regex = '''(?i)password[=:][\s"']*(admin|root|password|123456|qwerty)'''
  tags = ["password", "hardcoded"]

[[rules]]
  id = "terraform-secret"
  description = "Terraform Secret Variable"
  regex = '''(?i)(secret|token|key|password|access_key|secret_key)[_]*[=:]\s*["']([^"'\s]{8,})["']'''
  secretGroup = 2
  tags = ["terraform", "secret"]
  [rules.allowlist]
    # Matched against the captured value, so these exclude a SHAPE of value
    # rather than a file: a value that is exactly a variable expansion cannot
    # be a hardcoded secret, and a Terraform state object path is not one.
    regexes = [
      '''^\$\{?[A-Za-z_][A-Za-z0-9_]*\}?$''',  # e.g. "$ACR_PASSWORD"
      '''\.tfstate$''',                        # e.g. "${LAYER_SHORT}/terraform.tfstate"
    ]
    stopwords = [
      "topology.kubernetes.io/zone",   # Kubernetes topology spread constraint
      "scalability",                   # Kubernetes node selector label
      "lifecycle",                     # Kubernetes node selector label
      "manual-zitadel-scope-mgmt-pat", # a Secrets Manager secret NAME, not a value
    ]

[[rules]]
  id = "high-entropy-secret"
  description = "High Entropy Secret (very random strings)"
  regex = '''[A-Za-z0-9+/]{32,}'''
  entropy = 4.5
  tags = ["high-entropy", "secret"]
  [rules.allowlist]
    paths = [
      '''\.md$''',                   # Docs covered by docs-high-entropy-only rule
      '''\.txt$''',                  # Docs covered by docs-high-entropy-only rule
    ]

[[rules]]
  id = "docs-high-entropy-only"
  description = "Very High Entropy Only in Documentation"
  regex = '''[A-Za-z0-9+/]{40,}'''
  entropy = 5.0
  tags = ["documentation", "high-entropy", "secret"]
  paths = [
    '''\.md$''',     # Apply to all .md files
    '''\.txt$''',    # Apply to all .txt files
  ]
